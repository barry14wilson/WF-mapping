[build]
  functions = "netlify/functions"
  publish   = "."

# --- HTTP endpoints (consumed by the map & route APIs) --------------------
[[redirects]]
  from = "/api/safety-tiles"
  to   = "/.netlify/functions/safety-tiles"
  status = 200

[[redirects]]
  from = "/api/route-safety-check"
  to   = "/.netlify/functions/route-safety-check"
  status = 200

[[redirects]]
  from = "/api/fbi-state"
  to   = "/.netlify/functions/fbi-state"
  status = 200

[[redirects]]
  from = "/api/wf-admin"
  to   = "/.netlify/functions/wf-admin"
  status = 200

[[redirects]]
  from = "/api/city-guide"
  to   = "/.netlify/functions/wf-city-guide"
  status = 200

# Root URL serves the prototype map (rewrite, not redirect — keeps the URL clean).
[[redirects]]
  from = "/"
  to   = "/wiley-fox-uk-prototype.html"
  status = 200

# --- Scheduled ingest cadence (per Phase 5 spec) --------------------------
# UK + Mexico        — daily
# US, EU, AU, CA     — weekly
# UNODC, WB, ACLED   — monthly

[functions."scheduled-uk"]
  schedule = "@daily"

[functions."scheduled-mx"]
  schedule = "@daily"

[functions."scheduled-us"]
  schedule = "@weekly"

[functions."scheduled-eu"]
  schedule = "@weekly"

[functions."scheduled-au"]
  schedule = "@weekly"

[functions."scheduled-ca"]
  schedule = "@weekly"

[functions."scheduled-unodc"]
  schedule = "@monthly"

[functions."scheduled-worldbank"]
  schedule = "@monthly"

[functions."scheduled-acled"]
  schedule = "@monthly"

# City content database: YouTube discovery at 10:00 London time (runs 09:00 + 10:00 UTC,
# the function only works on the run that lands on 10:xx in Europe/London).
[functions."scheduled-youtube-discovery"]
  schedule = "0 9,10 * * *"

# Redesign preview served alongside the classic homepage (not indexed).
[[headers]]
  for = "/new/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
